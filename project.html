<style>
:root{--fs:min(11vw,19vh);--bg1:#ececee;--bg2:#dcdddf;--ink:#1c1d1f;--mute:#5d6064;--card:#f9fafa;--line:#e3e5e6;--pill:rgba(255,255,255,.85);--bar:rgba(255,255,255,.45);--on:#1c1d1f;--onfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a2b2d;--bg2:#1b1c1e;--ink:#f1f2f3;--mute:#a4a8ac;--pill:rgba(50,52,55,.85);--bar:rgba(50,52,55,.45);--on:#f1f2f3;--onfg:#1c1d1f}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Michroma','Arial Black',Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 40% 30%,var(--bg1),var(--bg2));overflow:hidden;cursor:none}
h1{position:fixed;left:6.5vw;top:calc(env(safe-area-inset-top,0px) + 21vh);margin:0;font-weight:400;font-size:var(--fs);line-height:.88;letter-spacing:-.02em;text-transform:uppercase}
.cap,.note{font-size:9px;line-height:1.6;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);position:fixed;z-index:3}
.cap{left:6.5vw;top:calc(env(safe-area-inset-top,0px) + 21vh + .88*var(--fs) + 16px)}
.note{right:5vw;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:320px}
.note:before{content:"";display:block;width:26px;border-top:1px solid var(--mute);margin-bottom:10px}
.paper{position:fixed;left:13vw;right:13vw;top:46vh;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);background:var(--card);border-radius:8px;box-shadow:0 30px 70px rgba(30,32,36,.12);padding:34px 50px 0}
#to{display:block;width:100%;margin:0 0 14px;padding:0 0 14px;border:0;border-bottom:1px solid var(--line);background:none;outline:0;font-family:inherit;font-size:22px;color:#2b2e31;cursor:text}
#from{position:absolute;left:50px;bottom:14px;width:240px;z-index:2;border:0;background:none;outline:0;font-family:inherit;font-size:11px;color:#4b4f53;cursor:text}
#to::placeholder,#from::placeholder{color:#b9bdc1}
.rx input::placeholder{color:transparent}
#stk{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none}
.sk{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:grab;user-select:none;touch-action:none}
.faded{position:absolute;left:50px;top:28px;max-width:55%;font-size:9px;line-height:1.7;letter-spacing:.12em;text-transform:uppercase;color:#c3c6c9;pointer-events:none}
.ui{cursor:auto}
.tray{position:fixed;left:13vw;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;gap:4px;padding:5px;border-radius:30px;background:var(--pill);backdrop-filter:blur(8px);z-index:5}
.tray button{width:44px;height:44px;border:0;background:none;border-radius:50%;cursor:pointer;display:grid;place-items:center;padding:0}
.tray button:hover{background:rgba(120,125,130,.15)}
.tray img{max-width:32px;max-height:32px;pointer-events:none}
#share{position:fixed;right:5.5vw;top:calc(env(safe-area-inset-top,0px) + 76px);z-index:6;display:flex;gap:8px;align-items:center;width:min(520px,90vw);padding:8px;border-radius:30px;background:var(--pill);box-shadow:0 8px 30px rgba(30,32,36,.12);backdrop-filter:blur(8px)}
#share[hidden]{display:none}
#lnk{flex:1;min-width:0;border:0;background:none;outline:0;font-family:inherit;font-size:9px;color:var(--ink);padding:0 10px;cursor:text}
#cp,#reply,#again{font:inherit;border:0;border-radius:30px;height:34px;padding:0 16px;background:var(--on);color:var(--onfg);font-size:9px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
#reply,#again{display:none}
.rx #reply,.rx #again{display:block}
.rx .bar>*:not(#reply):not(#again),.rx .tray,.rx #share{display:none}
#stk{transition:opacity .7s}
.rx #from,.rx #to{pointer-events:none}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
#pen{position:fixed;left:0;top:0;width:90px;height:500px;pointer-events:none;z-index:4;transform-origin:45px 498px;margin:-498px 0 0 -45px;will-change:transform;opacity:0}
#pen svg{position:absolute;inset:0;width:100%;height:100%;display:none}
#pen[data-p=a] .pa,#pen[data-p=b] .pb{display:block}
.bar{position:fixed;right:5.5vw;top:calc(env(safe-area-inset-top,0px) + 22px);display:flex;align-items:center;gap:6px;padding:6px;border-radius:40px;background:var(--bar);box-shadow:0 8px 30px rgba(30,32,36,.1);backdrop-filter:blur(8px);z-index:5;cursor:auto}
.bar button{font:inherit;border:0;background:none;color:var(--mute);cursor:pointer}
.sw{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:30px;font-size:9px;letter-spacing:.06em;text-transform:uppercase}
.sw[aria-pressed=true]{background:var(--on);color:var(--onfg)}
.sw .m{width:10px;height:10px;border-radius:2px}
.m.a{background:#0f3a5c}.m.b{background:#9a9c9e}
.sep{width:1px;height:24px;background:rgba(120,125,130,.3);margin:0 4px}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:8px!important;letter-spacing:.04em}.ic:hover{background:rgba(120,125,130,.15)}
.ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic[aria-pressed=true]{background:var(--on);color:var(--onfg)}
body.cur{cursor:auto}
button:focus-visible{outline:2px solid #2a52c9;outline-offset:2px}
@media (max-width:820px){.tray{left:5%}.paper{left:5%;right:5%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);top:calc(env(safe-area-inset-top,0px) + 21vh + .88*var(--fs) + 72px)}h1,.cap{left:5vw}.note{display:none}.bar{right:3vw}.sw{padding:6px 8px}}
</style>
</head>

const to={value:'',addEventListener(){}},fr={value:'',addEventListener(){}},layer=$('stk'),IM={};for(const k in SK){IM[k]=new Image();IM[k].src=SK[k]}
let stk=[];
if(!rx)try{stk=JSON.parse(localStorage.getItem('pens-stk-v1')||'[]').filter(k=>SK[k.id]);const m=JSON.parse(localStorage.getItem('pens-meta')||'{}');to.value=m.t||'';fr.value=m.f||''}catch(e){}
const cw=()=>cv.getBoundingClientRect().width||1;
function place(el,k){const W=cw();el.style.left=k.x*W+'px';el.style.top=k.y*W+'px';el.style.width=k.s*W+'px'}
function renderStk(){layer.innerHTML='';stk.forEach((k,i)=>{const el=new Image();el.src=SK[k.id];el.className='ui sk';el.draggable=false;el.dataset.i=i;place(el,k);layer.append(el)})}
let drag=null;
layer.addEventListener('pointerdown',e=>{const el=e.target.closest('.sk');if(!el||rx)return;const k=stk[+el.dataset.i],r=cv.getBoundingClientRect(),W=cw();drag={el,k,dx:e.clientX-r.left-k.x*W,dy:e.clientY-r.top-k.y*W};el.setPointerCapture(e.pointerId)});
layer.addEventListener('pointermove',e=>{if(!drag)return;const r=cv.getBoundingClientRect(),W=cw();drag.k.x=(e.clientX-r.left-drag.dx)/W;drag.k.y=(e.clientY-r.top-drag.dy)/W;place(drag.el,drag.k)});
layer.addEventListener('pointerup',()=>{if(drag){drag=null;save()}});
layer.addEventListener('wheel',e=>{const el=e.target.closest('.sk');if(!el||rx)return;e.preventDefault();const k=stk[+el.dataset.i];k.s=clamp(k.s*(e.deltaY<0?1.08:.93),.03,.5);place(el,k);save()},{passive:false});
layer.addEventListener('dblclick',e=>{const el=e.target.closest('.sk');if(!el||rx)return;stk.splice(+el.dataset.i,1);renderStk();save()});
for(const id in SK){const b=document.createElement('button');b.className='ui';b.title='Add sticker';b.setAttribute('aria-label','Add sticker');const im=new Image();im.src=SK[id];b.append(im);
 b.onclick=()=>{const W=cw(),H=cv.getBoundingClientRect().height;stk.push({id,x:.5+(Math.random()-.5)*.1,y:H/2/W+(Math.random()-.5)*.05,s:.09});renderStk();save()};$('tray').append(b)}
to.addEventListener('input',save);fr.addEventListener('input',save);
const b64=u=>{let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(t+'='.repeat((4-t.length%4)%4)),c=>c.charCodeAt(0))};
async function zip(str){const u=new TextEncoder().encode(str);if(!window.CompressionStream)return 'r'+b64(u);return 'z'+b64(new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()))}
async function unzip(t){const u=unb64(t.slice(1));if(t[0]==='r')return new TextDecoder().decode(u);return new TextDecoder().decode(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
function pack(){const W=cw(),s=strokes.map(st=>{const o=[],P=st.pts;let X=0,Y=0,L=null;P.forEach((q,i)=>{if(L&&i<P.length-1&&Math.hypot(q[0]-L[0],q[1]-L[1])<1.5)return;L=q;const x=Math.round(q[0]/W*1000),y=Math.round(q[1]/W*1000);o.push(x-X,y-Y,Math.round(q[2]/W*10000));X=x;Y=y});return[st.p||(st.c===INK.b?'b':'a'),o]});
 return JSON.stringify({t:to.value,f:fr.value,s,k:stk.map(k=>[k.id,Math.round(k.x*1000),Math.round(k.y*1000),Math.round(k.s*1000)])})}
function unpack(d){const W=cw();strokes=d.s.map(([p,o])=>{const pts=[];let X=0,Y=0;for(let i=0;i<o.length;i+=3){X+=o[i];Y+=o[i+1];pts.push([X/1000*W,Y/1000*W,Math.max(1,o[i+2]/10000*W)])}return{c:INK[p]||INK.a,p,pts}});stk=d.k.map(([id,x,y,s])=>({id,x:x/1000,y:y/1000,s:s/1000})).filter(k=>SK[k.id]);to.value=d.t||'';fr.value=d.f||''}


let replaying=false,rpToken=0,rpFull=null;
function replay(){if(!rpFull||!rpFull.length){layer.style.opacity=1;return}
 const tok=++rpToken,F=rpFull,d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);let len=0;
 F.forEach(s=>{for(let i=1;i<s.pts.length;i++)len+=d(s.pts[i],s.pts[i-1])});
 const v=len/(clamp(len/700,2.5,9)*1000)||1,T=[];let t=500;
 F.forEach(s=>{const ts=[t];for(let i=1;i<s.pts.length;i++){t+=Math.max(2,d(s.pts[i],s.pts[i-1])/v);ts.push(t)}T.push(ts);t+=260});
 const total=t+300;strokes=[];drawing=null;layer.style.opacity=0;replaying=true;over=true;
 const r0=cv.getBoundingClientRect(),f0=F[0].pts[0];tx=px=r0.left+f0[0];ty=py=r0.top+f0[1];let st=null;
 function step(now){if(tok!==rpToken)return;if(st===null)st=now;const e=now-st,done=[];let cs=null;
  for(let i=0;i<F.length;i++){const ts=T[i];if(e>=ts[ts.length-1]){done.push(F[i]);continue}
   if(e>=ts[0]){let k=1;while(k<ts.length&&ts[k]<=e)k++;cs={c:F[i].c,p:F[i].p,pts:F[i].pts.slice(0,k)}}break}
  strokes=done;drawing=cs;
  if(cs){if(cs.p&&cs.p!==cur)pick(cs.p);const r=cv.getBoundingClientRect(),q=cs.pts[cs.pts.length-1];tx=r.left+q[0];ty=r.top+q[1]}
  render();
  if(e<total)requestAnimationFrame(step);
  else{strokes=F;drawing=null;replaying=false;over=false;layer.style.opacity=1;render()}}
 requestAnimationFrame(step)}

/* ---------- toolbar ---------- */
function pick(p){if(p===cur)return;cur=p;swap=0;swapped=false;$('sa').setAttribute('aria-pressed',p==='a');$('sb').setAttribute('aria-pressed',p==='b')}
let cursorMode=rx,overBar=false;
function setMode(b){cursorMode=b;document.body.classList.toggle('cur',b);$('cm').setAttribute('aria-pressed',b)}
$('cm').onclick=()=>setMode(!cursorMode);
addEventListener('keydown',e=>{if(rx||e.target.tagName==='INPUT')return;if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key==='v'||e.key==='V'||e.key==='Escape'))setMode(!cursorMode)});
$('sa').onclick=()=>{setMode(false);pick('a')};$('sb').onclick=()=>{setMode(false);pick('b')};
const undo=()=>{if(strokes.length)strokes.pop();else if(stk.length){stk.pop();renderStk()}save();render()};
$('un').onclick=undo;$('rs').onclick=()=>{strokes=[];stk=[];renderStk();save();render()};
addEventListener('keydown',e=>{if(e.target.tagName!=='INPUT'&&(e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}});
function dlFile(href,name){const a=document.createElement('a');a.download=name;a.href=href;a.click()}
$('dl').onclick=()=>{const d=devicePixelRatio||1,W=cw(),o=document.createElement('canvas');o.width=cv.width;o.height=cv.height;const c=o.getContext('2d');c.fillStyle='#f9fafa';c.fillRect(0,0,o.width,o.height);c.drawImage(cv,0,0);
 stk.forEach(k=>{const im=IM[k.id],w=k.s*W*d,h=w*im.naturalHeight/im.naturalWidth;c.drawImage(im,k.x*W*d-w/2,k.y*W*d-h/2,w,h)});
 c.font=`${12*d}px Michroma,Arial`;c.fillStyle='#2b2e31';if(to.value)c.fillText('To '+to.value,14*d,24*d);if(fr.value)c.fillText('From '+fr.value,14*d,o.height-14*d);
 dlFile(o.toDataURL('image/png'),'card.png')};
$('again').onclick=()=>replay();
const share=$('share'),lnk=$('lnk');
$('sd').onclick=async()=>{if(!share.hidden){share.hidden=true;return}lnk.value=location.href.split('#')[0]+'#c='+await zip(pack());share.hidden=false;lnk.select()};
$('cp').onclick=async()=>{lnk.select();try{await navigator.clipboard.writeText(lnk.value)}catch(e){document.execCommand('copy')}$('cp').textContent='Copied';setTimeout(()=>$('cp').textContent='Copy link',1400)};
$('reply').onclick=()=>{rpToken++;replaying=false;rpFull=null;layer.style.opacity=1;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}const t=to.value,f=fr.value;rx=false;document.body.classList.remove('rx');strokes=[];stk=[];to.value=f;fr.value=t;to.readOnly=fr.readOnly=false;setMode(false);renderStk();render();save()};
addEventListener('resize',fit);fit();
if(rx)unzip(location.hash.slice(3)).then(t=>{unpack(JSON.parse(t));setMode(true);to.readOnly=fr.readOnly=true;renderStk();render();rpFull=strokes.slice();if(matchMedia('(prefers-reduced-motion: reduce)').matches)layer.style.opacity=1;else replay()}).catch(()=>{rx=false;document.body.classList.remove('rx');setMode(false)});


const pen=$('pen'),S0=()=>clamp(innerHeight/800,.8,1.3);
let vx=0,lift=1,t0=performance.now();
function frame(t){const dt=Math.max(.001,Math.min(.05,(t-t0)/1000));t0=t;
 const k=drawing?1:1-Math.pow(.0005,dt),ox=px;px+=(tx-px)*k;py+=(ty-py)*k;
 vx+=((px-ox)/dt-vx)*.15;lift+=((drawing?0:1)-lift)*(1-Math.pow(.002,dt));
 let sx=1;
 if(swap>=0){swap+=dt/.5;sx=Math.abs(Math.cos(Math.min(swap,1)*Math.PI));
  if(swap>=.5&&!swapped){pen.dataset.p=cur;swapped=true}
  if(swap>=1)swap=-1}
 const S=S0();
 pen.style.transform=`translate(${px}px,${py-lift*6}px) rotate(${-33+clamp(vx*.006,-6,6)}deg) scale(${sx*S},${S})`;
 pen.style.opacity=(replaying||over&&!cursorMode&&!overBar)?1:0;
 pen.style.filter=`drop-shadow(${12+lift*8}px ${18+lift*14}px ${16+lift*8}px rgba(20,25,35,${(.3-lift*.08).toFixed(2)}))`;
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
